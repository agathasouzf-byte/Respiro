<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0e8">
<title>Respiro — Cartas do Clube do Livro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root {
  --bg: #f5f0e8;
  --paper: #fffdf8;
  --ink: #315c38;
  --ink-dark: #23462a;
  --accent: #d9825b;
  --accent-soft: #f2d8c9;
  --line: #ded7ca;
  --shadow: 0 25px 70px rgba(49,92,56,.16);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "DM Sans", sans-serif;
  color: var(--ink-dark);
  background:
    radial-gradient(circle at 15% 10%, rgba(217,130,91,.10), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(49,92,56,.10), transparent 30%),
    var(--bg);
  display: flex;
  justify-content: center;
  padding: 28px 18px;
}

.app { width: min(920px, 100%); }

header { text-align: center; margin-bottom: 22px; }
.kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 8px;
}
h1 {
  margin: 0;
  font-family: "Playfair Display", serif;
  font-size: clamp(30px, 6vw, 52px);
  line-height: 1;
  color: var(--ink);
}
.subtitle { margin: 10px auto 0; color: #6d766d; max-width: 560px; font-size: 15px; }

.status {
  display: flex; justify-content: center; align-items: center; gap: 12px;
  margin: 18px auto 20px; flex-wrap: wrap;
}
.counter {
  background: rgba(255,253,248,.82); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700;
}
.progress {
  width: min(250px, 60vw); height: 8px; background: #e5ded1; border-radius: 99px; overflow: hidden;
}
.progress > span {
  display:block; height:100%; width:0%; background: var(--accent);
  border-radius: inherit; transition: width .45s ease;
}

.stage { display: grid; place-items: center; min-height: 550px; perspective: 1400px; }

.deck-wrap {
  position: relative; width: min(350px, 78vw); aspect-ratio: 0.70;
}
.deck-shadow {
  position: absolute; inset: 12px -14px -14px 14px; border-radius: 24px;
  background: rgba(49,92,56,.10); filter: blur(14px);
}
.deck-card {
  position: absolute; inset: 0; border-radius: 24px;
  box-shadow: var(--shadow); transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.2,.8,.2,1), filter .3s;
  cursor: default;
}
.deck-card.is-drawing { animation: shuffle .7s ease-in-out; }
.deck-card.flipped { transform: rotateY(180deg); }

.face {
  position: absolute; inset: 0; border-radius: inherit;
  backface-visibility: hidden; overflow: hidden;
}
.back {
  background: var(--paper);
  border: 1px solid rgba(49,92,56,.12);
  display: grid; place-items: center;
}
.back img { width: 100%; height: 100%; object-fit: cover; }
.back::after {
  content:""; position:absolute; inset:12px; border:1px solid rgba(49,92,56,.18);
  border-radius:18px; pointer-events:none;
}
.front {
  transform: rotateY(180deg);
  background: var(--paper);
  border: 1px solid rgba(49,92,56,.13);
  padding: 34px 28px;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  text-align:center;
}
.front .mini {
  font-size: 11px; letter-spacing:.15em; text-transform:uppercase; font-weight:700; color:var(--accent);
}
.question {
  font-family:"Playfair Display", serif;
  font-weight:700; font-size: clamp(22px, 4vw, 31px); line-height:1.14;
  color:var(--ink); max-width: 290px;
}
.brand { font-size: 11px; font-weight:700; letter-spacing:.05em; color:#839083; }

.controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top: 8px; }
button {
  border: 0; border-radius: 999px; padding: 13px 22px; font: 700 14px "DM Sans", sans-serif;
  cursor:pointer; transition: transform .2s, box-shadow .2s, opacity .2s;
}
button:hover { transform: translateY(-2px); }
button:active { transform: translateY(0); }
.primary { background: var(--ink); color:white; box-shadow: 0 10px 24px rgba(49,92,56,.22); }
.secondary { background: var(--paper); color:var(--ink); border:1px solid var(--line); }
button:disabled { opacity:.45; cursor:not-allowed; transform:none; }

.hint { text-align:center; color:#8a8e87; font-size:12px; margin:14px 0 0; }

@keyframes shuffle {
  0% { transform: rotateY(0) translateX(0) rotate(0); }
  20% { transform: rotateY(-18deg) translateX(-28px) rotate(-3deg); }
  40% { transform: rotateY(14deg) translateX(24px) rotate(3deg); }
  60% { transform: rotateY(-10deg) translateX(-15px) rotate(-2deg); }
  80% { transform: rotateY(7deg) translateX(9px) rotate(1deg); }
  100% { transform: rotateY(0) translateX(0) rotate(0); }
}

@media (max-width: 600px) {
  body { padding: 20px 12px; }
  header { margin-bottom: 10px; }
  .stage { min-height: 480px; }
  .deck-wrap { width: min(300px, 76vw); }
  .front { padding: 26px 22px; }
  .question { font-size: 23px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>

  <div class="controls">
    <button class="primary" id="draw">Sortear carta</button>
    <button class="secondary" id="reset">Embaralhar novamente</button>
  </div>
  <p class="hint" id="hint">As cartas sorteadas não voltam para o baralho até você recomeçar.</p>
</main>

<script>
const cards = ["VOCÊ DEFENDERIA AS DECISÕES DO(A) PROTAGONISTA?", "QUAL FOI A PRINCIPAL MENSAGEM OU LIÇÃO QUE VOCÊ TIROU DESSA HISTÓRIA?", "EM QUE MOMENTO EXATO VOCÊ PERCEBEU QUE A LEITURA TINHA ENGANADO (OU TRAVADO DE VEZ)?", "SE PUDESSE SE FAZER UMA ÚNICA PERGUNTA AO AUTOR(A) SOBRE O LIVRO, QUAL SERIA?", "SE A HISTÓRIA TIVESSE UM CAPÍTULO EXTRA, QUAL ASSUNTO ELE ABORDARIA?", "VOCÊ GOSTOU DO FINAL?", "O QUE VOCÊ MENOS GOSTOU NO LIVRO? (EX.: RITMO, ESTILO DE ESCRITA, DECISÕES, ETC.)", "QUAL PERSONAGEM MERECIA MAIS DESTAQUE... E QUAL DEVERIA TER APARECIDO MENOS?", "VOCÊ RECOMENDARIA ESSE LIVRO? PARA QUEM?", "QUAL TEORIA VOCÊ CRIOU DURANTE A LEITURA QUE ACABOU SENDO TOTALMENTE ERRADA?", "QUAL PERSONAGEM VOCÊ LEVARIA PARA UM JANTAR?", "RESUMA O LIVRO INTEIRO APENAS EM 3 PALAVRAS", "SE ESSA HISTÓRIA VIRASSE FILME, QUAL ATOR/ATRIZ SERIA PERFEITO(A) NO PAPEL PRINCIPAL?", "QUAL PERSONAGEM DESSE LIVRO SERIA O PRIMEIRO A SER CANCELADO NAS REDES SOCIAIS?", "ESCOLHA UMA MÚSICA (OU ESTILO MUSICAL) QUE SERIA A TRILHA SONORA PERFEITA PARA ESSA HISTÓRIA"];
const card = document.getElementById("card");
const question = document.getElementById("question");
const cardNumber = document.getElementById("cardNumber");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const drawBtn = document.getElementById("draw");
const resetBtn = document.getElementById("reset");
const hint = document.getElementById("hint");

let remaining = [...cards];
let drawn = [];
let busy = false;

function updateUI() {
  const used = drawn.length;
  counter.textContent = `${used} / ${cards.length} cartas`;
  progress.style.width = `${(used / cards.length) * 100}%`;

  if (used === cards.length) {
    drawBtn.disabled = true;
    drawBtn.textContent = "Baralho completo";
    hint.textContent = "Todas as cartas foram sorteadas. Embaralhe novamente para começar outra rodada.";
  } else {
    drawBtn.disabled = false;
    drawBtn.textContent = used === 0 ? "Sortear carta" : "Sortear outra";
    hint.textContent = "As cartas sorteadas não voltam para o baralho até você recomeçar.";
  }
}

function draw() {
  if (busy || remaining.length === 0) return;
  busy = true;

  card.classList.remove("flipped");
  card.classList.add("is-drawing");

  setTimeout(() => {
    const index = Math.floor(Math.random() * remaining.length);
    const selected = remaining.splice(index, 1)[0];
    drawn.push(selected);

    question.textContent = selected;
    cardNumber.textContent = drawn.length;

    card.classList.remove("is-drawing");
    void card.offsetWidth;

    setTimeout(() => {
      card.classList.add("flipped");
      busy = false;
      updateUI();
    }, 90);
  }, 650);
}

function reset() {
  busy = false;
  remaining = [...cards];
  drawn = [];
  card.classList.remove("flipped", "is-drawing");
  question.textContent = "Clique em “Sortear carta” para começar.";
  cardNumber.textContent = "—";
  updateUI();
}

drawBtn.addEventListener("click", draw);
resetBtn.addEventListener("click", reset);
updateUI();
</script>
